<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
<meta name="theme-color" content="#1f5fa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="画像アルバム">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="referrer" content="no-referrer">
<title>かんたん画像アルバム</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* アプリ側の部品はすべて app〜 の名前にして、アルバム表示部分と衝突しないようにしている */
#appBar{background:#1f5fa8;color:#fff;padding:calc(6px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 6px calc(10px + env(safe-area-inset-left));display:flex;align-items:center;gap:8px;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;position:relative}
#appStatus{flex:1;min-width:0;font-size:12px;line-height:1.35;white-space:pre-line;overflow:hidden;max-height:4.1em}
#appStatus.warn{color:#ffe2b8}
#appBar button{font:inherit;font-size:14px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:7px 11px;white-space:nowrap}
#appBar button:disabled{opacity:.5}
#appBar #appLogin{background:#fff;color:#1f5fa8;font-weight:700}
#appProgress{position:absolute;left:0;right:0;bottom:0;height:3px}
#appProgress i{display:block;height:100%;width:0;background:#f0a020;transition:width .2s}
#appMenuPanel{position:absolute;right:calc(8px + env(safe-area-inset-right));top:calc(48px + env(safe-area-inset-top));z-index:50;background:#fff;color:#202631;border:1px solid #d7dde5;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:12px;width:min(320px,calc(100vw - 16px));font-size:13px;line-height:1.6;white-space:pre-line;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
#appMenuPanel button{display:block;width:100%;margin-top:8px;font:inherit;font-size:14px;padding:8px 11px;border-radius:8px;color:#202631;border:1px solid #d7dde5;background:#f6f8fb;text-align:left}
#appNewBar{background:#fff4d6;color:#5c4300;padding:8px 12px;font-size:14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ecd9a2;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}
#appNewBar button{font:inherit;color:#5c4300;border:1px solid #c9a94f;background:#fff;border-radius:8px;padding:6px 10px}
#appHelp{padding:24px 18px;max-width:640px;margin:auto;line-height:1.8;font-size:15px;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:#202631}
#appHelp h1{font-size:20px;margin:0 0 12px}
#appHelp .note{color:#5a6574;font-size:13px}
[hidden]{display:none!important}
body{margin:0;background:#eef1f5}
</style>
</head>
<body>
<div id="appBar">
  <div id="appStatus">起動中…</div>
  <button id="appLogin" type="button" hidden>ログイン</button>
  <button id="appRefresh" type="button">更新</button>
  <button id="appMenu" type="button" aria-label="メニュー">…</button>
  <div id="appProgress"><i></i></div>
</div>
<div id="appMenuPanel" hidden>
  <div id="appInfo">情報を読み込み中…</div>
  <button id="appRestore" type="button">ひとつ前に取得したアルバムを表示</button>
  <button id="appLogout" type="button">ログアウト（端末の画像は残ります）</button>
  <button id="appCloseMenu" type="button">閉じる</button>
</div>
<div id="appNewBar" hidden><span>PCで更新された新しいアルバムがあります。</span><button id="appShowNew" type="button">表示する</button></div>
<div id="appHelp">
  <h1>かんたん画像アルバム</h1>
  <p>PCで保存したチャート画像を、OneDriveから取り込んで表示します。</p>
  <p>初回は、インターネットにつながった状態で上の「ログイン」を押し、OneDriveで使っているMicrosoftアカウントでログインしてください。</p>
  <p class="note">一度取り込んだ画像は端末に保存され、オフラインでも見られます。</p>
</div>
<div id="albumRoot" hidden></div>
<script src="config.js"></script>
<script src="album-view.js"></script>
<script src="app.js"></script>
</body>
</html>
